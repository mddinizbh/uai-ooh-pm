# Service listens on 8085 — matches Nginx, Dockerfile EXPOSE and docker-compose.
server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:uai_buslines}
    username: ${DB_USER:uai}
    password: ${DB_PASSWORD:uai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway — Hibernate must NOT modify it (ADR-003/004)
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator — expose health for uAI DoD liveness/readiness
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# OpenAPI — served at /api/docs (populated in task_06)
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

# GTFS feed downloader (task_02)
# Official PBH/BHTRANS GTFS feed (CKAN dataset "gtfs" -> S3). WGS84, ~53MB.
# Override with GTFS_FEED_URL at deploy time if the resource URL changes.
gtfs:
  feed:
    url: ${GTFS_FEED_URL:https://s3.amazonaws.com/mobilibus-uploads/gtfs/GTFSBHTRANS.zip}
    max-retries: 3
    retry-delay-ms: 2000
    request-timeout-seconds: 60

# Neighbourhood boundary downloader (task_03)
# Real source: PBH CKAN "Bairro Popular" GeoJSON (487 bairros, NOME/CODIGO).
# ⚠ PRODUCTION GAPS (validated 2026-05-26, not yet handled in code):
#   1. CRS: this file is EPSG:32723 (UTM 23S), but the classifier requires WGS84.
#      Reprojection UTM->WGS84 must be added (or serve a pre-reprojected file).
#   2. WAF: ckan.pbh.gov.br returns 403 without a browser User-Agent header.
#   Locally this was bypassed by serving a pre-reprojected WGS84 GeoJSON.
boundary:
  url: ${BOUNDARY_URL:https://ckan.pbh.gov.br/dataset/6e2f98ef-78bb-465a-af75-a48dca879de6/resource/1579c16d-7aec-4ff8-a873-2fd03917d557/download/bairro_popular_lei1069814012014.geojson}
  request-timeout-seconds: 60

# Import orchestration (task_05)
buslines:
  import:
    # Cron schedule for the automated GTFS import (default: 3 AM daily).
    # Override with IMPORT_SCHEDULE environment variable at deploy time.
    schedule: ${IMPORT_SCHEDULE:0 0 3 * * *}
    # Set to false to disable the scheduled trigger without removing the bean.
    # Overridden to false in application-test.yml to avoid interference with IT tests.
    scheduler:
      enabled: true
  internal:
    # API key that protects POST /api/internal/import.
    # Must be set via UAI_INTERNAL_API_KEY environment variable in production.
    # If blank, all requests to /api/internal/** are rejected (fail-safe).
    api-key: ${UAI_INTERNAL_API_KEY:}
