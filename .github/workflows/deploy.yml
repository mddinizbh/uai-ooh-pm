# CI — BH Bus Lines (build & publish only)
#
# Trigger: every push to main (test + build/push) or PR to main (test only).
#
# Jobs:
#   test        → runs backend (mvn verify) + frontend (vitest) tests.
#                 If any test fails the pipeline stops here (no image built).
#   build-push  → builds both Docker images, pushes to GHCR with :latest + :<sha> tags.
#                 Runs only on push to main, only after test passes.
#
# Deployment is centralized in the uai-infra pipeline (single place that SSHes the
# VPS and runs docker compose). This repo never touches the VPS, so it needs no
# VPS secrets — only the automatic GITHUB_TOKEN to push to GHCR.

name: CI — BH Bus Lines

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/mddinizbh/uai-buslines
  WEB_IMAGE: ghcr.io/mddinizbh/uai-buslines-web

jobs:
  # ── 1. Test ── gates every downstream job ─────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 21 — JaCoCo 0.8.12 fails on Java 25 (major version 69)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # mvn verify = unit tests (Surefire) + integration tests (Failsafe) + JaCoCo check
      - name: Backend tests (mvn verify)
        run: mvn verify -B

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --silent

      # vitest run — exits non-zero if any test fails, failing the job
      - name: Frontend tests (vitest)
        working-directory: web
        run: npm test

  # ── 2. Build + Push ── only on push to main, after tests pass ─────────────
  build-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write  # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SPA image ─────────────────────────────────────────────────────────
      - name: Build and push SPA image
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ── handled centrally by the uai-infra pipeline, not here ───────
  # This repo only builds and publishes images to GHCR. Bringing the containers
  # up on the VPS (docker compose pull/up in /opt/uai) is done by uai-infra's
  # deploy, so SSH credentials live only in uai-infra (no VPS secrets here).
