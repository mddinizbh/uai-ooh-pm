server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all routes (HTML5 history API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long-lived cache — Vite generates hashed filenames so
    # cache-busting is guaranteed by the build tool.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Lightweight health probe for Docker / load balancer checks
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
